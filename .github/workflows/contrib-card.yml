name: Update contributions card

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:             # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contributions and stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python make_contrib.py avnish-prajapati

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          if [ -f stats.svg ]; then git add stats.svg; fi
          git diff --staged --quiet || (git commit -m "Update contributions and stats cards" && git push)
